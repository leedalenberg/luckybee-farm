<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Honeybee AR | Lucky Bee Farm</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #instructions {
      position: fixed;
      top: 10px;
      left: 5%;
      width: 90%;
      background: rgba(0, 60, 30, 0.85);
      color: white;
      padding: 12px 0;
      text-align: center;
      border-radius: 10px;
      z-index: 1000;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div id="instructions">
    🐝 Point your camera at your Lucky Bee Farm Honeybee card
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ../../tracking/honeybee.mind;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity mindar-image-target="targetIndex: 0">

      <a-box
        position="0 0 0.15"
        width="0.35"
        height="0.35"
        depth="0.30"
        color="#FFD700"
        rotation="20 30 0">
      </a-box>

    </a-entity>

  </a-scene>

</body>
</html>
